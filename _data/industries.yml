- title: Language Technologies
  icon: lucide:languages
  video: language-technologies
  text: Go beyond the native iOS language support. Serve underrepresented languages and communities, with richer tools, better layouts, and locale-aware features.

- title: Artificial Intelligence
  icon: lucide:sparkles
  video: ai-features
  text: Bring AI right into the typing experience. Expose custom AI models, smart actions, and rich suggestions, directly where your users write.

- title: Voice AI
  icon: lucide:mic
  video: voice-ai
  text: Let your users dictate text and trigger voice commands without leaving the keyboard, seamlessly integrated into any app.

- title: Science & Research
  icon: lucide:flask-conical
  video: science-research
  text: Analyze on-device keyboard usage and typing patterns to surface behavioral insights, from cognitive load to early indicators of mental health changes.

- title: Medicine & Health
  icon: lucide:heart-pulse
  video: medicine-health
  text: Surface biometric data and health insights at the point of input, giving medical users constant, contextual access to critical information.

- title: Bank & Finance
  icon: lucide:landmark
  video: bank-finance
  text: Surface real-time financial data, sell triggers, and portfolio insights directly within the keyboard, keeping traders and advisors informed as they work.

- title: Child Protection
  icon: lucide:shield-alert
  video: child-protection
  text: Detect real-time exposure to harmful content or signs of grooming or bullying, helping keep kids safer wherever they type, as a natural part of their digital life.

- title: Media
  icon: lucide:popcorn
  video: media
  text: Let users play, pause, and share from the keyboard, with now-playing controls and casting that integrates with your main app, right where they type.

- title: Entertainment & Fun
  icon: lucide:party-popper
  video: entertainment-fun
  text: Build delightful keyboard experiences, like GIF keyboards, sticker packs, emoji tools, and custom fonts and effects, that bring joy and happiness to the typing experience.

- title: Accessibility
  icon: ph:person-simple-circle
  video: accessibility
  text: Make typing work for everyone. Build keyboards with larger keys, high-contrast themes and simpler layouts for people who need it.
